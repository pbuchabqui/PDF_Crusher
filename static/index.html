<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF_Crusher - Processador de PDFs Jurídicos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 6px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8f9ff;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: #e6e9ff;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .upload-text {
            color: #667eea;
            font-weight: 500;
        }

        input[type="file"] {
            display: none;
        }

        input[type="checkbox"] {
            margin-right: 8px;
        }

        .groq-panel {
            display: none;
            background: #f8f9ff;
            padding: 15px;
            border-radius: 6px;
            margin-top: 10px;
        }

        .groq-panel.show {
            display: block;
        }

        .groq-panel label {
            margin-bottom: 5px;
            font-weight: normal;
            font-size: 14px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 5px;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            display: none;
            font-size: 14px;
        }

        .status.show {
            display: block;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.loading {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top-color: #667eea;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .results {
            margin-top: 20px;
            display: none;
        }

        .results.show {
            display: block;
        }

        .results h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .file-list {
            display: grid;
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 4px;
            font-size: 13px;
        }

        .file-name {
            color: #333;
            font-weight: 500;
            word-break: break-all;
            flex: 1;
        }

        .btn-download {
            padding: 6px 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            margin-left: 10px;
        }

        .btn-download:hover {
            background: #764ba2;
        }

        .groq-notice {
            color: #666;
            font-size: 12px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ PDF_Crusher</h1>
        <p class="subtitle">Processe PDFs jurídicos com higienização de dados pessoais</p>

        <form id="uploadForm">
            <div class="form-group">
                <label for="pdfInput">Selecione o PDF</label>
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📄</div>
                    <div class="upload-text">Arraste um PDF aqui ou clique para selecionar</div>
                    <input type="file" id="pdfInput" accept=".pdf" />
                </div>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox" id="useGroq" />
                    Usar Groq para anonimizar nomes
                </label>
                <div class="groq-panel" id="groqPanel">
                    <label for="groqKey">Groq API Key</label>
                    <input type="password" id="groqKey" placeholder="gsk_..." />
                    <div class="groq-notice">
                        Modelo: llama-3.3-70b-versatile • chunks: 30K • timeout: 60s
                    </div>
                </div>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-primary" id="submitBtn">
                    ▶ Processar PDF
                </button>
                <button type="reset" class="btn-secondary">
                    Limpar
                </button>
            </div>
        </form>

        <div class="status" id="status"></div>

        <div class="results" id="results">
            <h3>📦 Arquivos gerados</h3>
            <div id="fileList" class="file-list"></div>
            <button type="button" class="btn-primary" style="width: 100%; margin-top: 15px;" id="downloadZipBtn">
                📦 Baixar todos (ZIP)
            </button>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
